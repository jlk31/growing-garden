<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta property="og:title" content="Our Garden">
<meta property="og:description" content="Something I grew for you.">
<title>Our Garden</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 30'%3E%3Cpath fill='%23ff4d6d' d='M16 29S1 19 1 9.5C1 4.5 5 1 9.5 1c3 0 5.5 1.6 6.5 4 1-2.4 3.5-4 6.5-4C27 1 31 4.5 31 9.5 31 19 16 29 16 29z'/%3E%3C/svg%3E">
<style>
  :root {
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --ink: #4a2c3d;
    --cream: #fff8ec;
    --peach: #fde4d3;
    --night: #170b24;
  }
  * { box-sizing: border-box; margin: 0; }
  html { scroll-behavior: smooth; }
  body { font: 1.05rem/1.6 var(--serif); color: var(--ink); background: var(--night); text-align: center; }
  h1, h2 { font-style: italic; font-weight: 400; line-height: 1.1; }

  /* Section 1: the garden */
  .garden { min-height: 100svh; padding: 4rem 1rem; background: linear-gradient(var(--cream), var(--peach)); }
  h1 { font-size: clamp(2.6rem, 9vw, 4.5rem); }
  .lede { max-width: 32ch; margin: .75rem auto 2.5rem; }
  #flowers { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: .5rem .15rem; max-width: 56rem; margin: 0 auto; }
  .flower {
    transform-origin: 50% 100%;
    animation: grow .7s cubic-bezier(.2, 1.4, .4, 1) min(calc(var(--i) * 15ms), 2s) backwards,
               sway 4s ease-in-out var(--d) infinite alternate;
  }
  @keyframes grow { from { scale: 0; } }
  @keyframes sway { from { rotate: -4deg; } to { rotate: 4deg; } }
  .down { display: inline-block; margin-top: 3rem; color: inherit; }

  /* Section 2: the heart tree. The gradient is the sky going from sunset to night. */
  .tree {
    min-height: 100svh;
    padding: 36vh max(1rem, calc(50vw - 30rem)) 4rem;
    color: #fdeef3;
    background: linear-gradient(var(--peach), #f2a7a0 8vh, #8b4b7e 18vh, #2b1638 30vh, var(--night) 60vh);
    display: grid; gap: 2rem; align-items: center; justify-items: center;
  }
  .tree svg { width: min(100%, 26rem); height: auto; }
  /* Each heart is drawn centred on 0,0 and moved into place with `translate`,
     so `scale` and `rotate` pivot around the heart's own centre. */
  #canopy use { animation: beat 2s ease-in-out infinite alternate; }
  @keyframes beat { from { scale: .8; opacity: .75; } to { scale: 1.15; opacity: 1; } }

  h2 { font-size: clamp(1.6rem, 5vw, 2.4rem); }
  #counter {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.25rem .75rem; margin: 1.5rem 0;
    font: .8rem/1.4 system-ui, sans-serif; letter-spacing: .1em; text-transform: uppercase;
  }
  #counter b { display: block; font: 400 clamp(2.4rem, 9vw, 3.6rem)/1.1 var(--serif); font-variant-numeric: tabular-nums; letter-spacing: 0; color: #ffb3c1; }
  .note { margin-top: 2rem; font-style: italic; opacity: .8; }

  @media (min-width: 48rem) { .tree { grid-template-columns: 1fr 1fr; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<!-- Shapes drawn once here and reused by every flower and heart on the page. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="daisy" viewBox="0 0 40 80">
    <path d="M20 80C18 60 22 45 20 26" fill="none" stroke="#5f9c6a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M20 60c-9-1-13-7-13-12 8 0 13 5 13 12z" fill="#7dbb83"/>
    <g fill="currentColor">
      <ellipse cx="20" cy="10" rx="5" ry="8"/>
      <ellipse cx="20" cy="10" rx="5" ry="8" transform="rotate(72 20 20)"/>
      <ellipse cx="20" cy="10" rx="5" ry="8" transform="rotate(144 20 20)"/>
      <ellipse cx="20" cy="10" rx="5" ry="8" transform="rotate(216 20 20)"/>
      <ellipse cx="20" cy="10" rx="5" ry="8" transform="rotate(288 20 20)"/>
    </g>
    <circle cx="20" cy="20" r="5" fill="#f6c445"/>
  </symbol>
  <symbol id="tulip" viewBox="0 0 40 80">
    <path d="M20 80C22 60 18 45 20 30" fill="none" stroke="#5f9c6a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M20 62c9-1 13-7 13-12-8 0-13 5-13 12z" fill="#7dbb83"/>
    <path d="M9 8c4 3 7 3 11-4 4 7 7 7 11 4 2 12-2 24-11 24S7 20 9 8z" fill="currentColor"/>
  </symbol>
  <symbol id="poppy" viewBox="0 0 40 80">
    <path d="M20 80C18 62 22 46 20 28" fill="none" stroke="#5f9c6a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M20 64c-9-1-13-7-13-12 8 0 13 5 13 12z" fill="#7dbb83"/>
    <g fill="currentColor">
      <circle cx="20" cy="11" r="8"/><circle cx="29" cy="20" r="8"/>
      <circle cx="20" cy="29" r="8"/><circle cx="11" cy="20" r="8"/>
    </g>
    <circle cx="20" cy="20" r="4" fill="#4a2c3d"/>
  </symbol>
  <symbol id="heart" viewBox="0 0 32 30">
    <path d="M16 29S1 19 1 9.5C1 4.5 5 1 9.5 1c3 0 5.5 1.6 6.5 4 1-2.4 3.5-4 6.5-4C27 1 31 4.5 31 9.5 31 19 16 29 16 29z" fill="currentColor"/>
  </symbol>
</svg>

<section class="garden">
  <h1>Our garden</h1>
  <p class="lede">A new flower grows here for every week we've been together. <span id="planted"></span></p>
  <div id="flowers" role="img"></div>
  <a class="down" href="#tree">Keep scrolling &darr;</a>
</section>

<section class="tree" id="tree">
  <svg viewBox="0 0 400 470" role="img" aria-label="A tree whose leaves are beating hearts">
    <ellipse cx="200" cy="456" rx="120" ry="10" fill="#000" opacity=".25"/>
    <path d="M184 458c8-50 12-100 13-160h6c1 60 5 110 13 160z" fill="#8a5a44"/>
    <path d="M199 330c-20-30-50-45-80-55M201 330c20-30 50-45 80-55M200 320V200" fill="none" stroke="#8a5a44" stroke-width="5" stroke-linecap="round"/>
    <g id="canopy"></g>
  </svg>
  <div class="together">
    <h2>Together for</h2>
    <div id="counter" role="timer"></div>
    <p id="since"></p>
    <p class="note">and I'd plant every one of them again.</p>
  </div>
</section>

<script>
// ---- The only two things you need to edit -------------------------------
const START = '2025-02-14';   // the day you got together, as YYYY-MM-DD
const HEARTS = 170;           // how many hearts make up the tree
// --------------------------------------------------------------------------

const PETALS = ['#e8577e', '#f28b54', '#f2b93b', '#b06ad9', '#5b8def', '#ef6f9f', '#ff9eb5'];
const HEART_COLOURS = ['#ff4d6d', '#ff758f', '#ffb3c1', '#c9184a', '#f9a03f', '#b185db', '#ffd166'];
const $ = id => document.getElementById(id);

const start = new Date(START + 'T00:00');   // midnight, local time
if (isNaN(start)) {
  document.body.textContent = 'START in index.html must be a real date written as YYYY-MM-DD.';
  throw new Error('Invalid START date');
}

// Calendar-accurate gap between two dates: whole years, months and days,
// plus the total number of days. Month lengths and leap years are handled by
// stepping forward in whole months (clamping e.g. 31 Jan + 1 month to 28/29 Feb).
function together(from, to) {
  const addMonths = n => {
    const d = new Date(from.getFullYear(), from.getMonth() + n, 1);
    const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(from.getDate(), lastDay));
    return d;
  };
  let months = (to.getFullYear() - from.getFullYear()) * 12 + to.getMonth() - from.getMonth();
  if (addMonths(months) > to) months--;
  const today = new Date(to.getFullYear(), to.getMonth(), to.getDate());
  const DAY = 864e5;   // Math.round absorbs the 23- and 25-hour days around clock changes
  return {
    years: Math.floor(months / 12),
    months: months % 12,
    days: Math.round((today - addMonths(months)) / DAY),
    totalDays: Math.round((today - from) / DAY),
  };
}

// Seeded random numbers (mulberry32). Math.random() would reshuffle the garden
// on every visit; a fixed seed means flower 12 is always the same flower.
function seeded(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function plantGarden(weeks) {
  const rand = seeded(1), pick = list => list[Math.floor(rand() * list.length)];
  let html = '';
  for (let i = 0; i < weeks; i++) {
    const width = Math.round(34 + rand() * 14);
    html += `<svg class="flower" viewBox="0 0 40 80" width="${width}" height="${width * 2}"
      style="color:${pick(PETALS)};--i:${i};--d:${(-rand() * 4).toFixed(2)}s"><use href="#${pick(['daisy', 'tulip', 'poppy'])}"/></svg>`;
  }
  $('flowers').innerHTML = html;
  $('flowers').setAttribute('aria-label', `A garden of ${weeks} flowers`);
  $('planted').textContent = `${weeks} so far.`;
}

function growTree() {
  const rand = seeded(2), pick = list => list[Math.floor(rand() * list.length)];
  let html = '';
  for (let placed = 0; placed < HEARTS;) {
    // Pick a random point and keep it only if it falls inside the heart curve
    // (x^2 + y^2 - 1)^3 - x^2 * y^3 <= 0, so the canopy itself is heart-shaped.
    const x = rand() * 2.3 - 1.15, y = rand() * 2.25 - 1;
    if ((x * x + y * y - 1) ** 3 - x * x * y ** 3 > 0) continue;
    const size = Math.round(14 + rand() * 16);
    html += `<use href="#heart" x="${-size / 2}" y="${-size / 2}" width="${size}" height="${size}"
      style="translate:${Math.round(200 + x * 140)}px ${Math.round(195 - y * 140)}px;rotate:${Math.round(rand() * 50 - 25)}deg;color:${pick(HEART_COLOURS)};
      animation-duration:${(1.6 + rand() * 2).toFixed(2)}s;animation-delay:${(-rand() * 3).toFixed(2)}s"/>`;
    placed++;
  }
  $('canopy').innerHTML = html;
}

// If START is still in the future, count from zero instead of going negative.
const now = () => new Date(Math.max(Date.now(), start));

function tick() {
  const t = now(), gap = together(start, t);
  const cells = [[gap.years, 'year'], [gap.months, 'month'], [gap.days, 'day'],
                 [t.getHours(), 'hour'], [t.getMinutes(), 'minute'], [t.getSeconds(), 'second']];
  $('counter').innerHTML = cells.map(([value, unit]) => `<div><b>${value}</b>${unit}${value === 1 ? '' : 's'}</div>`).join('');
}

const { totalDays } = together(start, now());
plantGarden(Math.floor(totalDays / 7) + 1);   // +1: the first flower is planted on day one
growTree();
tick();
setInterval(tick, 1000);
$('since').textContent = `${totalDays.toLocaleString('en-GB')} days since ${start.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}`;

// Self-check for the date maths: open index.html#test and look at the browser console.
if (location.hash === '#test') {
  const gap = (from, to) => Object.values(together(new Date(from + 'T00:00'), new Date(to + 'T12:00'))).join();
  console.assert(gap('2025-02-14', '2025-02-14') === '0,0,0,0', 'day one');
  console.assert(gap('2025-02-14', '2026-02-14') === '1,0,0,365', 'first anniversary');
  console.assert(gap('2025-02-14', '2026-02-13') === '0,11,30,364', 'day before anniversary');
  console.assert(gap('2024-01-31', '2024-03-01') === '0,1,1,30', 'month end into a leap February');
  console.assert(gap('2024-02-29', '2025-02-28') === '1,0,0,365', 'leap-day start');
  console.assert(gap('2026-03-01', '2026-04-01') === '0,1,0,31', 'across the UK clock change');
  console.log('Self-check finished: any failures are listed above.');
}
</script>
</body>
</html>
