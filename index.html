<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffe4ea">
<meta property="og:title" content="For you">
<meta property="og:description" content="Something I grew for you.">
<title>For You</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 30'%3E%3Cpath fill='%23e8263f' d='M16 29S1 19 1 9.5C1 4.5 5 1 9.5 1c3 0 5.5 1.6 6.5 4 1-2.4 3.5-4 6.5-4C27 1 31 4.5 31 9.5 31 19 16 29 16 29z'/%3E%3C/svg%3E">
<style>
  @import url("https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600;800&display=swap");

  :root {
    --ink: #3a2430;
    --red: #e8263f;
    --wood: #7a4a2a;
    --glass: rgb(255 255 255 / .55);
    --glass-edge: rgb(255 255 255 / .85);
    --glow: 0 10px 30px rgb(201 24 74 / .18);
    --ground: 9svh;
    --script: "Dancing Script", "Snell Roundhand", "Segoe Script", "Brush Script MT", cursive;
    --round: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: var(--round); color: var(--ink); background: #ffe4ea; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid rgb(232 38 63 / .5); outline-offset: 4px; border-radius: 14px; }

  /* One fixed screen, no scrolling: a soft pink dawn with warm glows and a few twinkles. */
  #stage {
    position: fixed; inset: 0; overflow: hidden;
    background:
      radial-gradient(ellipse 55% 40% at 85% 8%, rgb(255 190 208 / .95), transparent 70%),
      radial-gradient(ellipse 45% 35% at 8% 22%, rgb(255 222 196 / .8), transparent 70%),
      radial-gradient(ellipse 130% 35% at 50% 100%, #ffc8bd, transparent 75%),
      linear-gradient(172deg, #fffafa 0%, #ffeef2 40%, #ffdcd6 100%);
  }
  #stage::before {
    content: ""; position: absolute; inset: 0 0 35%; pointer-events: none;
    background-image:
      radial-gradient(circle, rgb(255 110 150 / .45) 0 1.5px, transparent 2.5px),
      radial-gradient(circle, rgb(255 170 120 / .4) 0 1px, transparent 2px);
    background-size: 150px 130px, 95px 85px;
    background-position: 20px 30px, 60px 10px;
    animation: twinkle 3.5s ease-in-out infinite alternate;
  }

  /* ---------- Before the tap ---------- */
  #start {
    position: absolute; left: 50%; top: 45%; translate: -50% -50%;
    display: flex; flex-direction: column; align-items: center; gap: 1rem; z-index: 3;
  }
  #start::before {
    content: ""; position: absolute; top: 0; left: 50%; width: 5rem; aspect-ratio: 1; translate: -50% 0;
    border-radius: 50%; border: 2px solid rgb(232 38 63 / .35); animation: ring 2s ease-out infinite;
  }
  #start svg { width: 5rem; color: var(--red); filter: drop-shadow(0 8px 14px rgb(201 24 74 / .4)); animation: beat 1.2s ease-in-out infinite; }
  #start span {
    font-weight: 800; font-size: 1rem; letter-spacing: .02em; color: var(--red); white-space: nowrap;
    padding: .6rem 1.4rem; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-edge);
    box-shadow: var(--glow); backdrop-filter: blur(8px); transition: background .2s, scale .2s;
  }
  #start:hover span { background: #fff; scale: 1.04; }

  #love-text {
    position: absolute; left: 0; right: 0; top: 28%; width: fit-content; margin-inline: auto; padding: 0 .2em;
    text-align: center; z-index: 3; pointer-events: none; opacity: 0;
    font: 700 clamp(2.8rem, 12vw, 4.4rem) var(--script);
    background: linear-gradient(90deg, var(--red), #ff6f9a 55%, #ff8c42);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 12px rgb(232 38 63 / .25));
  }
  #seed { position: absolute; left: 50%; top: 45%; width: 1.1rem; translate: -50% 0; color: var(--red); opacity: 0; filter: drop-shadow(0 3px 4px rgb(201 24 74 / .4)); }
  .ground {
    position: absolute; left: 4%; right: 4%; bottom: var(--ground); height: 3px; border-radius: 3px; scale: 0 1;
    background: linear-gradient(90deg, transparent, var(--wood) 12%, var(--wood) 88%, transparent);
  }
  .ground::after {
    content: ""; position: absolute; left: 0; right: 0; top: 3px; height: var(--ground);
    background: linear-gradient(rgb(122 74 42 / .14), transparent 80%);
  }

  /* ---------- The tree ---------- */
  #tree {
    position: absolute; left: 50%; bottom: var(--ground); translate: -50% 0; z-index: 1;
    height: min(calc(100svh - var(--ground) - 15.5rem), 125vw); aspect-ratio: 400 / 520; overflow: visible;
  }
  .trunk { fill: var(--wood); transform-box: fill-box; transform-origin: 50% 100%; scale: 1 0; }
  .branch { fill: none; stroke: var(--wood); stroke-linecap: round; stroke-dasharray: 1 2; stroke-dashoffset: 1; opacity: 0; }
  .crown { transform-origin: 200px 520px; }
  /* Each heart is drawn centred on 0,0 and moved with `translate`, so `scale` pops it from its own centre. */
  #canopy use { scale: 0; }

  #meadow { position: absolute; left: 6%; right: 6%; bottom: var(--ground); height: 3rem; z-index: 0; }
  #meadow svg { position: absolute; bottom: 0; translate: -50% 0; transform-origin: 50% 100%; scale: 0; }

  /* ---------- After the tree has grown ---------- */
  #info {
    position: absolute; left: 0; right: 0; top: max(1rem, 2.5svh); z-index: 2;
    display: grid; justify-items: center; gap: .3rem; padding: 0 1rem; text-align: center;
    opacity: 0; visibility: hidden;
  }
  #open-letter {
    position: relative; width: 4.6rem; color: var(--red); transition: scale .2s;
    filter: drop-shadow(0 8px 12px rgb(201 24 74 / .35)); animation: beat 1.6s ease-in-out infinite;
  }
  #open-letter:hover { scale: 1.08; }
  #open-letter span { position: absolute; inset: 0 0 12%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: .8rem; letter-spacing: .04em; }
  .eyebrow { margin-top: .2rem; font: 700 1.6rem var(--script); color: var(--red); }
  #counter { display: flex; flex-wrap: wrap; justify-content: center; gap: .45rem; }
  #counter span {
    display: grid; justify-items: center; min-width: 3.8rem; padding: .4rem .55rem .3rem; border-radius: 14px;
    background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: 0 6px 16px rgb(201 24 74 / .12); backdrop-filter: blur(8px);
  }
  #counter b { font-size: clamp(1.35rem, 6.5vw, 2rem); line-height: 1.1; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--red); }
  #counter small { font-size: .62rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; opacity: .6; }
  #since { margin-top: .25rem; font-size: .8rem; opacity: .7; }

  .petal { position: absolute; width: .9rem; z-index: 2; pointer-events: none; animation: drift linear forwards; }

  /* ---------- The letter: a sheet of ruled notepaper ---------- */
  #letter {
    width: min(92vw, 34rem); max-height: 86svh; margin: auto; padding: 0; border: 0; border-radius: 24px; color: var(--ink);
    background: linear-gradient(165deg, #fffaf7, #ffe0d8);
    box-shadow: 0 30px 80px rgb(58 36 48 / .35), inset 0 0 0 1px rgb(255 255 255 / .7);
    scrollbar-width: thin; scrollbar-color: #ff9eb5 transparent;
  }
  #letter[open] { animation: open .4s cubic-bezier(.3, 1.4, .5, 1); }
  #letter::backdrop { background: rgb(58 36 48 / .45); backdrop-filter: blur(4px); }
  .sheet { padding: 3.5rem 1.25rem 1.5rem; }
  .close {
    position: absolute; top: .9rem; right: .9rem; width: 2.1rem; height: 2.1rem; border-radius: 50%;
    background: var(--red); color: #fff; font-size: 1.3rem; line-height: 1; box-shadow: 0 4px 10px rgb(201 24 74 / .35);
    transition: rotate .25s, scale .25s;
  }
  .close:hover { rotate: 90deg; scale: 1.08; }
  #letter-text {
    --line: 1.8em;
    min-height: 9rem; padding: 1rem 1.2rem 1.2rem 2.6rem; border-radius: 14px;
    white-space: pre-line; font-size: 1.02rem; line-height: var(--line);
    background:
      linear-gradient(90deg, transparent 1.8rem, rgb(232 38 63 / .3) 1.8rem calc(1.8rem + 1.5px), transparent 0),
      repeating-linear-gradient(transparent 0 calc(var(--line) - 1px), rgb(91 141 239 / .18) 0 var(--line)),
      #fffdfb;
    background-origin: padding-box, content-box, padding-box;
    background-attachment: local;
    box-shadow: 0 6px 20px rgb(58 36 48 / .08);
  }
  #letter-text::first-line { font: 700 1.55rem var(--script); color: var(--red); }
  .typing::after { content: ""; display: inline-block; width: 2px; height: 1.1em; margin-left: 1px; vertical-align: -.2em; background: currentColor; animation: blink 1s steps(1) infinite; }

  /* ---------- The sequence. Everything above waits for .go, added on the first tap. ---------- */
  .go #start { animation: vanish .4s forwards; pointer-events: none; }
  .go #love-text { animation: say 2.8s ease-out .3s forwards; }
  .go #seed { animation: fall .9s ease-in .4s forwards, vanish .3s 1.5s forwards; }
  .go .ground { animation: widen .8s ease-out .6s forwards; }
  .go .trunk { animation: grow .9s ease-out 1.3s forwards; }
  .go .branch { animation: draw .9s ease-out var(--t) forwards; }
  .go .crown { animation: sway 5s ease-in-out 5.5s infinite alternate; }
  .go #canopy use { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) var(--t) forwards; }
  .go #meadow svg { animation: grow-flower .6s cubic-bezier(.3, 1.5, .5, 1) var(--t) forwards, flower-sway 4s ease-in-out var(--s) infinite alternate; }
  .go #info { animation: appear .8s ease-out 6s forwards; }

  @keyframes beat { 50% { scale: 1.08; } }
  @keyframes ring { from { scale: .7; opacity: 1; } to { scale: 1.9; opacity: 0; } }
  @keyframes twinkle { from { opacity: .9; } to { opacity: .3; } }
  @keyframes vanish { to { opacity: 0; scale: .3; } }
  @keyframes say { 0% { opacity: 0; translate: 0 10px; } 25%, 70% { opacity: 1; translate: 0 0; } 100% { opacity: 0; } }
  @keyframes fall { from { opacity: 1; } to { opacity: 1; top: calc(100% - var(--ground) - 1.1rem); } }
  @keyframes widen { to { scale: 1 1; } }
  @keyframes grow { to { scale: 1 1; } }
  @keyframes draw { from { opacity: 1; } to { opacity: 1; stroke-dashoffset: 0; } }
  @keyframes pop { to { scale: 1; } }
  @keyframes grow-flower { to { scale: 1; } }
  @keyframes flower-sway { from { rotate: -5deg; } to { rotate: 5deg; } }
  @keyframes sway { from { rotate: -.8deg; } to { rotate: .8deg; } }
  @keyframes appear { from { translate: 0 10px; } to { opacity: 1; visibility: visible; } }
  @keyframes drift { 0% { opacity: 0; } 10%, 85% { opacity: 1; } 100% { opacity: 0; translate: var(--drift) var(--fall); rotate: var(--spin); } }
  @keyframes open { from { opacity: 0; scale: .9; translate: 0 12px; } }
  @keyframes blink { 50% { opacity: 0; } }

  /* Laptop or landscape: once grown, the tree slides right and the counter sits on the left in a frosted card. */
  @media (min-aspect-ratio: 1/1) and (min-width: 48rem) {
    #tree { height: calc(100svh - var(--ground) - 3rem); }
    .go #tree { animation: slide 1s ease-in-out 5.6s forwards; }
    #info {
      left: 5%; right: auto; top: 50%; width: 42%; translate: 0 -50%; gap: .5rem; padding: 2.5rem 2rem;
      border-radius: 28px; background: rgb(255 255 255 / .35); border: 1px solid var(--glass-edge);
      box-shadow: var(--glow); backdrop-filter: blur(12px);
    }
    .go #info { animation-name: appear-card; }
    #open-letter { width: 6.5rem; }
    #open-letter span { font-size: .95rem; }
    .eyebrow { font-size: 2.1rem; }
    #counter { gap: .6rem; }
    #counter span { min-width: 5rem; padding: .6rem .8rem .45rem; }
    #counter b { font-size: 2.4rem; }
    #counter small { font-size: .7rem; }
  }
  @keyframes slide { to { left: 70%; } }
  @keyframes appear-card { to { opacity: 1; visibility: visible; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<!-- Shapes drawn once and reused by every heart and flower on the page. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="heart" viewBox="0 0 32 30">
    <path d="M16 29S1 19 1 9.5C1 4.5 5 1 9.5 1c3 0 5.5 1.6 6.5 4 1-2.4 3.5-4 6.5-4C27 1 31 4.5 31 9.5 31 19 16 29 16 29z" fill="currentColor"/>
  </symbol>
  <symbol id="daisy" viewBox="0 0 40 80">
    <path d="M20 80C18 60 22 45 20 26" fill="none" stroke="#5f9c6a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M20 60c-9-1-13-7-13-12 8 0 13 5 13 12z" fill="#7dbb83"/>
    <g fill="currentColor">
      <ellipse cx="20" cy="10" rx="5" ry="8"/>
      <ellipse cx="20" cy="10" rx="5" ry="8" transform="rotate(72 20 20)"/>
      <ellipse cx="20" cy="10" rx="5" ry="8" transform="rotate(144 20 20)"/>
      <ellipse cx="20" cy="10" rx="5" ry="8" transform="rotate(216 20 20)"/>
      <ellipse cx="20" cy="10" rx="5" ry="8" transform="rotate(288 20 20)"/>
    </g>
    <circle cx="20" cy="20" r="5" fill="#f6c445"/>
  </symbol>
  <symbol id="tulip" viewBox="0 0 40 80">
    <path d="M20 80C22 60 18 45 20 30" fill="none" stroke="#5f9c6a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M20 62c9-1 13-7 13-12-8 0-13 5-13 12z" fill="#7dbb83"/>
    <path d="M9 8c4 3 7 3 11-4 4 7 7 7 11 4 2 12-2 24-11 24S7 20 9 8z" fill="currentColor"/>
  </symbol>
  <symbol id="poppy" viewBox="0 0 40 80">
    <path d="M20 80C18 62 22 46 20 28" fill="none" stroke="#5f9c6a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M20 64c-9-1-13-7-13-12 8 0 13 5 13 12z" fill="#7dbb83"/>
    <g fill="currentColor">
      <circle cx="20" cy="11" r="8"/><circle cx="29" cy="20" r="8"/>
      <circle cx="20" cy="29" r="8"/><circle cx="11" cy="20" r="8"/>
    </g>
    <circle cx="20" cy="20" r="4" fill="#4a2c3d"/>
  </symbol>
</svg>

<main id="stage">
  <button id="start" type="button">
    <svg viewBox="0 0 32 30" aria-hidden="true"><use href="#heart"/></svg>
    <span>Tap me, love</span>
  </button>
  <p id="love-text" aria-hidden="true">I love you</p>
  <svg id="seed" viewBox="0 0 32 30" aria-hidden="true"><use href="#heart"/></svg>

  <div id="meadow" role="img"></div>
  <div class="ground"></div>

  <svg id="tree" viewBox="0 0 400 520" role="img" aria-label="A tree whose leaves are hearts">
    <path class="trunk" d="M186 520C191 450 194 380 196 300h8c2 80 5 150 10 220z"/>
    <g class="crown">
      <path class="branch" pathLength="1" stroke-width="7" style="--t:2s"   d="M199 330C190 285 165 245 125 222"/>
      <path class="branch" pathLength="1" stroke-width="7" style="--t:2.1s" d="M201 330C214 285 240 250 282 225"/>
      <path class="branch" pathLength="1" stroke-width="6" style="--t:2.2s" d="M200 305C198 250 201 195 199 120"/>
      <path class="branch" pathLength="1" stroke-width="6" style="--t:2.2s" d="M197 372C170 350 135 335 92 300"/>
      <path class="branch" pathLength="1" stroke-width="6" style="--t:2.3s" d="M203 372C233 352 268 335 310 300"/>
      <path class="branch" pathLength="1" stroke-width="4" style="--t:2.5s" d="M168 262C152 232 146 205 148 170"/>
      <path class="branch" pathLength="1" stroke-width="4" style="--t:2.5s" d="M232 262C249 232 256 205 254 172"/>
      <path class="branch" pathLength="1" stroke-width="3" style="--t:2.6s" d="M140 315C118 300 95 280 78 252"/>
      <path class="branch" pathLength="1" stroke-width="3" style="--t:2.6s" d="M262 315C284 300 306 280 322 252"/>
      <g id="canopy"></g>
    </g>
  </svg>

  <section id="info">
    <button id="open-letter" type="button" aria-label="Open your letter">
      <svg viewBox="0 0 32 30" aria-hidden="true"><use href="#heart"/></svg>
      <span aria-hidden="true">Letter</span>
    </button>
    <p class="eyebrow">Our time together...</p>
    <div id="counter" role="timer"></div>
    <p id="since"></p>
  </section>
</main>

<dialog id="letter" aria-label="Your letter">
  <div class="sheet">
    <form method="dialog"><button class="close" aria-label="Close letter">&times;</button></form>
    <p id="letter-text"></p>
  </div>
</dialog>

<script>
// ---- The things to edit -------------------------------------------------
const START = '2026-07-03';   // the day you got together, as YYYY-MM-DD
const LETTER = `Hi, my love...

I wanted to make you something that keeps on growing, because that's what we do. Every week we're together, a new flower comes up under this tree, so the longer we last, the fuller it gets.

I know we can't always be in the same place, but every time I see you it's worth every mile. Thank you for being exactly who you are.

I love you, more than this little tree can hold.

J x`;
// --------------------------------------------------------------------------

const HEARTS = 240;
const HEART_COLOURS = ['#ff1f5a', '#ff4f81', '#ff7aa2', '#ffb3c6', '#ff8c42', '#ffb627', '#ffd23f', '#e0218a', '#f72585'];
const PETALS = ['#e8577e', '#f28b54', '#f2b93b', '#b06ad9', '#5b8def', '#ef6f9f', '#ff9eb5'];
const DAY = 864e5;
const $ = id => document.getElementById(id);
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const start = new Date(START + 'T00:00');   // midnight, local time
if (isNaN(start)) {
  document.body.textContent = 'START in index.html must be a real date written as YYYY-MM-DD.';
  throw new Error('Invalid START date');
}

// Whole calendar days between two dates. Math.round absorbs the 23- and
// 25-hour days around the clocks changing.
function daysBetween(from, to) {
  return Math.round((new Date(to.getFullYear(), to.getMonth(), to.getDate()) - from) / DAY);
}

// Seeded random numbers (mulberry32): the tree and the meadow look the same on
// every visit, and existing flowers never move when a new one appears.
function seeded(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function growCanopy() {
  const rand = seeded(2), hearts = [];
  while (hearts.length < HEARTS) {
    // Keep only points inside the heart curve (x^2 + y^2 - 1)^3 - x^2 * y^3 <= 0,
    // so the canopy itself is heart-shaped.
    const x = rand() * 2.3 - 1.15, y = rand() * 2.25 - 1;
    if ((x * x + y * y - 1) ** 3 - x * x * y ** 3 <= 0) hearts.push({ x, y, r: rand() });
  }
  // Pop in from the middle of the tree outwards, like it's blossoming.
  hearts.sort((a, b) => Math.hypot(a.x, a.y + .2) - Math.hypot(b.x, b.y + .2));
  $('canopy').innerHTML = hearts.map(({ x, y, r }, i) => {
    const size = Math.round(11 + r * 12);
    return `<use href="#heart" x="${-size / 2}" y="${-size / 2}" width="${size}" height="${size}" style="translate:${Math.round(200 + x * 150)}px ${Math.round(225 - y * 150)}px;rotate:${Math.round((r - .5) * 50)}deg;color:${HEART_COLOURS[i % HEART_COLOURS.length]};--t:${(2.9 + i / HEARTS * 2.3).toFixed(2)}s"/>`;
  }).join('');
}

function plantMeadow(weeks) {
  const rand = seeded(1), pick = list => list[Math.floor(rand() * list.length)];
  let html = '';
  for (let i = 0; i < weeks; i++) {
    // ponytail: flowers land at random spots and overlap as the years go by, which reads as a fuller meadow; add a second row if it ever looks crowded
    const width = Math.round(16 + rand() * 10);
    html += `<svg viewBox="0 0 40 80" width="${width}" height="${width * 2}" style="left:${(rand() * 100).toFixed(1)}%;color:${pick(PETALS)};--t:${(5.3 + i * .04).toFixed(2)}s;--s:${(5.3 - rand() * 4).toFixed(2)}s"><use href="#${pick(['daisy', 'tulip', 'poppy'])}"/></svg>`;
  }
  $('meadow').innerHTML = html;
  $('meadow').setAttribute('aria-label', `${weeks} flowers, one for every week together`);
}

const now = () => new Date(Math.max(Date.now(), start));   // a future START counts from zero

function tick() {
  const t = now();
  const parts = [[daysBetween(start, t), 'day'], [t.getHours(), 'hr'], [t.getMinutes(), 'min'], [t.getSeconds(), 'sec']];
  $('counter').innerHTML = parts.map(([value, unit]) => `<span><b>${value}</b><small>${unit}${value === 1 || unit !== 'day' ? '' : 's'}</small></span>`).join('');
}

function dropPetal() {
  const tree = $('tree').getBoundingClientRect(), ground = document.querySelector('.ground').getBoundingClientRect();
  const x = tree.left + tree.width * (.15 + Math.random() * .7), y = tree.top + tree.height * (.1 + Math.random() * .45);
  const petal = document.createElement('div');
  petal.className = 'petal';
  petal.innerHTML = '<svg viewBox="0 0 32 30"><use href="#heart"/></svg>';
  petal.style.cssText = `left:${x}px;top:${y}px;color:${HEART_COLOURS[Math.floor(Math.random() * HEART_COLOURS.length)]};` +
    `--fall:${ground.top - y - 12}px;--drift:${Math.round((Math.random() - .5) * 90)}px;--spin:${Math.round((Math.random() - .5) * 120)}deg;animation-duration:${(4 + Math.random() * 3).toFixed(1)}s`;
  petal.addEventListener('animationend', () => petal.remove());
  $('stage').append(petal);
}

const weeks = Math.floor(daysBetween(start, now()) / 7) + 1;   // the first flower is planted on day one
growCanopy();
plantMeadow(weeks);
tick();
setInterval(tick, 1000);
$('since').textContent = `since ${start.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })} · ${weeks} ${weeks === 1 ? 'flower' : 'flowers'}, one for every week`;

$('start').addEventListener('click', () => {
  document.body.classList.add('go');
  if (!reducedMotion) setTimeout(() => setInterval(dropPetal, 900), 6500);
}, { once: true });

// The letter types itself out the first time it is opened; after that it is just there.
let typingStarted = false;
$('open-letter').addEventListener('click', () => {
  $('letter').showModal();
  if (typingStarted) return;
  typingStarted = true;
  const text = $('letter-text');
  if (reducedMotion) { text.textContent = LETTER; return; }
  let shown = 0;
  text.classList.add('typing');
  const timer = setInterval(() => {
    text.textContent = LETTER.slice(0, ++shown);
    if (shown >= LETTER.length) { clearInterval(timer); text.classList.remove('typing'); }
  }, 35);
});
// Tapping the dark area around the letter closes it too.
$('letter').addEventListener('click', e => { if (e.target === $('letter')) $('letter').close(); });

// Self-check for the date maths: open index.html#test and look at the browser console.
if (location.hash === '#test') {
  const days = (from, to) => daysBetween(new Date(from + 'T00:00'), new Date(to + 'T12:00'));
  console.assert(days('2026-07-03', '2026-07-03') === 0, 'day one');
  console.assert(days('2026-07-03', '2026-10-08') === 97, 'three months in');
  console.assert(days('2026-03-01', '2026-04-01') === 31, 'across the spring clock change');
  console.assert(days('2026-10-01', '2026-11-01') === 31, 'across the autumn clock change');
  console.assert(days('2028-02-28', '2028-03-01') === 2, 'leap year');
  console.log('Self-check finished: any failures are listed above.');
}
</script>
